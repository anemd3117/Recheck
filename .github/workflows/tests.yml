name: Unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Verify static evidence normalization
        run: node --test resources/docker/static/normalize.test.mjs resources/docker/static/managed.test.mjs
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run unit tests
        env:
          RECHECK_DATA_DIR: ${{ runner.temp }}/recheck-test-data
        run: python -m pytest -q tests
