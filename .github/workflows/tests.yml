name: Unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Verify static evidence normalization
        run: node --test resources/docker/static/normalize.test.mjs resources/docker/static/managed.test.mjs
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Check Python correctness
        run: |
          python -m pip install -r requirements-quality.txt
          python -m ruff check .
      - name: Run unit tests
        env:
          RECHECK_DATA_DIR: ${{ runner.temp }}/recheck-test-data
        run: python -m pytest -q tests --junitxml=test-results.xml
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 14
